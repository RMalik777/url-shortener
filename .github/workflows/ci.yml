name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public build-time values (same as wrangler.jsonc vars). Secrets are not needed to build.
      VITE_APP_URL: https://url.raflimalik.com/
      VITE_LONG_URL: https://url.raflimalik.com/
      VITE_SHORT_URL: https://raf.li/
      VITE_ROOT_REDIRECT_URL: https://link.raflimalik.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, type check, test, build
        run: pnpm turbo run lint check-types test build --ui=stream

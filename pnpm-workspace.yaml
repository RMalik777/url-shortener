packages:
  - apps/*
  - packages/*

# @better-auth/cli pins kysely 0.28.x, which forks drizzle-orm's peer resolution and
# gives apps/web a different drizzle instance than @repo/db. Pin one version so the
# `urls` table type stays assignable to eq()/and()/count().
overrides:
  kysely: 0.29.4

allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  '@babel/core': ^8.0.7
  '@base-ui/react': ^1.9.0
  '@better-auth/passkey': ^1.7.12
  '@better-auth/utils': ^0.5.0
  '@cloudflare/vite-plugin': ^1.64.0
  '@cloudflare/workers-types': ^5.20261022.1
  '@codspeed/vitest-plugin': ^6.1.0
  '@eslint/compat': ^2.1.1
  '@rolldown/plugin-babel': ^0.2.4
  '@t3-oss/env-core': ^0.13.11
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/eslint-config': ^0.4.0
  '@tanstack/match-sorter-utils': ^9.2.6
  '@tanstack/react-devtools': ^0.10.13
  '@tanstack/react-form': ^1.33.5
  '@tanstack/react-form-start': ^1.33.5
  '@tanstack/react-query': ^5.104.5
  '@tanstack/react-query-devtools': ^5.104.5
  '@tanstack/react-router': ^1.170.45
  '@tanstack/react-router-devtools': ^1.167.2
  '@tanstack/react-router-ssr-query': ^1.167.3
  '@tanstack/react-start': ^1.169.3
  '@tanstack/react-table': ^9.3.1
  '@tanstack/router-plugin': ^1.168.47
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/babel__core': ^7.20.5
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@unpic/react': ^1.0.2
  '@vitejs/plugin-react': ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  better-auth: ^1.7.12
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dotenv: ^18.0.8
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  drizzle-zod: ^0.8.3
  eslint: ^10.13.0
  jsdom: ^30.1.3
  lucide-react: ^1.61.0
  onedollarstats: ^0.0.23
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  rimraf: ^6.1.3
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  uuid: ^14.0.3
  vite: ^8.3.5
  vitest: ^5.0.5
  web-vitals: ^6.2.3
  wrangler: ^4.151.3
  zod: ^4.6.7

cleanupUnusedCatalogs: true

minimumReleaseAgeExclude:
  - '@base-ui/react@1.5.0'
  - '@base-ui/utils@0.2.9'
  - '@cloudflare/vite-plugin@1.37.2'
  - '@cloudflare/workers-types@4.20260520.1'
  - '@types/node@25.9.1'
  - '@types/react@19.2.15'
  - miniflare@4.20260518.0
  - tsx@4.22.3
  - wrangler@4.93.0

permissions:
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/match-sorter-utils':
    skills: true
  '@tanstack/react-start':
    skills: true
  '@tanstack/react-table':
    skills: true
  '@tanstack/router-plugin':
    skills: true

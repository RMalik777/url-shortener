packages:
  - apps/*
  - packages/*

# @better-auth/cli pins kysely 0.28.x, which forks drizzle-orm's peer resolution and
# gives apps/web a different drizzle instance than @repo/db. Pin one version so the
# `urls` table type stays assignable to eq()/and()/count().
overrides:
  kysely: 0.29.4

allowBuilds:
  '@prisma/client': false
  better-sqlite3: false
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  '@babel/core': ^8.0.1
  '@cloudflare/vite-plugin': ^1.51.3
  '@cloudflare/workers-types': ^5.20260812.1
  '@rolldown/plugin-babel': ^0.2.3
  '@t3-oss/env-core': ^0.13.11
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': ^0.8.3
  '@tanstack/eslint-config': ^0.4.0
  '@tanstack/match-sorter-utils': ^9.1.2
  '@tanstack/react-devtools': ^0.10.10
  '@tanstack/react-form': ^1.33.5
  '@tanstack/react-form-start': ^1.33.5
  '@tanstack/react-query': ^5.101.4
  '@tanstack/react-query-devtools': ^5.101.4
  '@tanstack/react-router': ^1.170.27
  '@tanstack/react-router-devtools': ^1.167.1
  '@tanstack/react-router-ssr-query': ^1.167.1
  '@tanstack/react-start': ^1.168.44
  '@tanstack/react-table': ^9.1.2
  '@tanstack/router-plugin': ^1.168.30
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/babel__core': ^7.20.5
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@unpic/react': ^1.0.2
  '@vitejs/plugin-react': ^6.0.5
  babel-plugin-react-compiler: ^1.0.0
  better-auth: ^1.6.27
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dotenv: ^17.4.2
  drizzle-orm: ^0.45.2
  drizzle-zod: ^0.8.3
  eslint: ^10.8.1
  jsdom: ^30.0.1
  lucide-react: ^1.31.0
  onedollarstats: ^0.0.23
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.2.8
  react-dom: ^19.2.8
  solid-js: ^1.9.14
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  typescript: ^7.0.2
  uuid: ^14.0.1
  vite: ^8.2.1
  vitest: ^4.1.10
  web-vitals: ^6.1.0
  wrangler: ^4.121.0
  zod: ^4.4.3

cleanupUnusedCatalogs: true

ignoredBuiltDependencies:
  - '@prisma/client'
  - better-sqlite3
  - core-js-pure

minimumReleaseAgeExclude:
  - '@base-ui/react@1.5.0'
  - '@base-ui/utils@0.2.9'
  - '@cloudflare/vite-plugin@1.37.2'
  - '@cloudflare/workers-types@4.20260520.1'
  - '@types/node@25.9.1'
  - '@types/react@19.2.15'
  - miniflare@4.20260518.0
  - tsx@4.22.3
  - wrangler@4.93.0

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - sharp
  - unrs-resolver
  - workerd
